name: confluence-knowledge

on:
  push:
    paths: ["mcp/confluence-knowledge/**", ".github/workflows/confluence-knowledge.yml"]
  pull_request:
    paths: ["mcp/confluence-knowledge/**", ".github/workflows/confluence-knowledge.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + dev deps
        run: pip install -e './mcp/confluence-knowledge[dev]'
      - name: Lint
        run: ruff check mcp/confluence-knowledge/src mcp/confluence-knowledge/tests
      - name: Unit tests (offline — no models, no network)
        run: pytest mcp/confluence-knowledge/tests -q
      - name: CLI smoke
        shell: bash
        run: |
          if python -c "import sys; sys.exit(0 if sys.version_info < (3,12) else 1)"; then
            export SETUPTOOLS_USE_DISTUTILS=stdlib
          fi
          pip install -e './mcp/confluence-knowledge' --quiet
          confluence-knowledge --help >/dev/null
          confluence-knowledge doctor || test $? -le 4

  e2e:
    # real bootstrap replay — fake server, no secrets; catches what unit
    # tests can't (venv layout, pip install, register paths, path quoting)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine + deps for prepare-models
        run: pip install -e './mcp/confluence-knowledge[models]'
      - name: Cache model artifacts
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.cache/ck-models
          key: ck-models-${{ hashFiles('mcp/confluence-knowledge/src/confluence_knowledge/models.lock.json') }}-${{ runner.os }}
      - name: Warm model cache (only on lock change)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -c "from pathlib import Path; from confluence_knowledge.retrieval import prepare_models; prepare_models(Path.home()/'.cache'/'ck-models')"
      - name: Bootstrap e2e — fresh install → crawl → cited answer
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          CK_MODEL_CACHE: ~/.cache/ck-models/models
        run: python mcp/confluence-knowledge/scripts/e2e_bootstrap.py --service ./mcp/confluence-knowledge
      - name: Journey e2e — user navigation, register to daemon kill
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python mcp/confluence-knowledge/scripts/e2e_journey.py
      - name: Session replay — FakeIDE corner + hardening matrix
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          KNOWLEDGE_FAKE_EMBEDDINGS: "1"
        run: |
          python mcp/confluence-knowledge/scripts/ide_replay.py             mcp/confluence-knowledge/scripts/sessions/wrong-env-token.json             mcp/confluence-knowledge/scripts/sessions/auth-expiry-midcrawl.json             mcp/confluence-knowledge/scripts/sessions/corrupt-index.json             mcp/confluence-knowledge/scripts/sessions/two-windows.json             mcp/confluence-knowledge/scripts/sessions/cancel-refresh.json             mcp/confluence-knowledge/scripts/sessions/server-kill-midcall.json
      - name: HTTP transport e2e — daemon endpoint, kill, suspend-wake
        shell: bash
        env:
          KNOWLEDGE_E2E: "1"
        run: |
          python -m pip install pytest
          cd mcp/confluence-knowledge
          python -m pytest tests/e2e/sessions/ -x -q
      - name: Failure e2e — break the install, verify doctor flags + recovery
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          CK_MODEL_CACHE: ~/.cache/ck-models/models
        run: python mcp/confluence-knowledge/scripts/e2e_failure.py
