name: publish-pypi
on:
  push:
    tags: ["confluence-knowledge-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing (preferred) — falls back to secret token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build mcp/confluence-knowledge
      - uses: pypa/gh-action-pypi-publish@release/v1
        # API-token auth: PYPI_API_TOKEN repository secret on GitHub.
        # (Trusted publishing would work too — PyPI project settings →
        #  Publishing — but passing the secret is explicit and one less setup.)
        with:
          packages-dir: mcp/confluence-knowledge/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
