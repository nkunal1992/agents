name: sharepoint-knowledge

on:
  push:
    paths: ["mcp/sharepoint-knowledge/**", "mcp/confluence-knowledge/src/**",
            ".github/workflows/sharepoint-knowledge.yml"]
  pull_request:
    paths: ["mcp/sharepoint-knowledge/**", "mcp/confluence-knowledge/src/**",
            ".github/workflows/sharepoint-knowledge.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engine + package + dev deps
        run: |
          pip install -e './mcp/confluence-knowledge[dev]'
          pip install -e './mcp/sharepoint-knowledge[dev]'
      - name: Lint
        run: ruff check mcp/sharepoint-knowledge/src mcp/sharepoint-knowledge/tests
      - name: Unit tests (offline — no models, no network)
        run: pytest mcp/sharepoint-knowledge/tests -q
      - name: CLI smoke
        run: sharepoint-knowledge --help >/dev/null
