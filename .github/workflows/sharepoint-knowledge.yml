name: sharepoint-knowledge

on:
  push:
    paths: ["mcp/sharepoint-knowledge/**", "mcp/confluence-knowledge/src/**",
            ".github/workflows/sharepoint-knowledge.yml"]
  pull_request:
    paths: ["mcp/sharepoint-knowledge/**", "mcp/confluence-knowledge/src/**",
            ".github/workflows/sharepoint-knowledge.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Secure installer (emSign CA fix)
        run: python -m pip install -U "pip>=26.2.2" "certifi>=2026.10.19"
      - name: Install engine + package + dev deps
        shell: bash
        run: |
          pip install -e './mcp/confluence-knowledge[dev]'
          # pip_system_certs' .pth imports distutils early → _distutils_hack
          # assert on py3.11 only (3.12+ has no stdlib distutils to poison;
          # stdlib mode there would break setuptools entirely)
          if python -c "import sys; sys.exit(0 if sys.version_info < (3,12) else 1)"; then
            export SETUPTOOLS_USE_DISTUTILS=stdlib
          fi
          pip install -e './mcp/sharepoint-knowledge[dev]'
      - name: Lint
        run: ruff check mcp/sharepoint-knowledge/src mcp/sharepoint-knowledge/tests
      - name: Managed-laptop pattern gate
        run: python scripts/check_managed.py
      - name: Unit tests (offline — no models, no network)
        run: pytest mcp/sharepoint-knowledge/tests -q
      - name: CLI smoke
        shell: bash
        run: sharepoint-knowledge --help >/dev/null

  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Secure installer (emSign CA fix)
        run: python -m pip install -U "pip>=26.2.2" "certifi>=2026.10.19"
      - name: Install engine + deps for prepare-models
        run: pip install -e './mcp/confluence-knowledge[models]'
      - name: Cache model artifacts
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.cache/ck-models
          key: ck-models-${{ hashFiles('mcp/confluence-knowledge/src/confluence_knowledge/models.lock.json') }}-${{ runner.os }}
      - name: Warm model cache (only on lock change)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -c "from pathlib import Path; from confluence_knowledge.retrieval import prepare_models; prepare_models(Path.home()/'.cache'/'ck-models')"
      - name: Bootstrap e2e — fresh install → crawl → cited answer
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          CK_MODEL_CACHE: ~/.cache/ck-models/models
        run: python mcp/sharepoint-knowledge/scripts/e2e_bootstrap_sp.py
      - name: Failure e2e — break the install, verify doctor flags + recovery
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          CK_MODEL_CACHE: ~/.cache/ck-models/models
        run: python mcp/sharepoint-knowledge/scripts/e2e_failure_sp.py
      - name: Kill leftover daemon/watchdog orphans
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | \
              Where-Object { \$_.CommandLine -match 'confluence_knowledge\.(daemon|watchdog|server)' } | \
              ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -EA SilentlyContinue }" || true
          else
            pkill -f "confluence_knowledge.\(daemon\|watchdog\|server\)" 2>/dev/null || true
          fi
          exit 0
