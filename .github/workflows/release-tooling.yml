name: release-tooling

on:
  push:
    paths: ["scripts/release_gate.py", "scripts/tests/**",
            ".github/workflows/publish-pypi.yml",
            ".github/workflows/release-tooling.yml"]
  pull_request:
    paths: ["scripts/release_gate.py", "scripts/tests/**",
            ".github/workflows/publish-pypi.yml",
            ".github/workflows/release-tooling.yml"]

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest packaging
      - run: pytest scripts/tests -q
