[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharepoint-knowledge"
version = "0.2.1"
description = "SharePoint connector for the grounded-Q&A engine — site pages + document libraries, Entra device-code sign-in, local models, cited answers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "confluence-knowledge[files]>=0.5.1",
    "msal>=1.31",
    "httpx>=0.27",
    "mcp>=1.8",
]

[project.optional-dependencies]
models = [
    "confluence-knowledge[models]>=0.5.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.scripts]
sharepoint-knowledge = "sharepoint_knowledge.cli_sp:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/nkunal1992/agents"
