[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-knowledge"
version = "0.8.0"
description = "Local, GET-only Confluence subtree indexer + grounded-Q&A MCP service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12",
    "numpy>=1.26,<3",
    "packaging>=23",
    "keyring>=25.2",
    "mcp>=1.6,<2",
    "pip-system-certs>=5.0",  # OS cert store → works behind TLS-inspecting proxies
    "psutil>=7,<8",           # memory guard + battery saver for crawls
]

[project.urls]
Repository = "https://github.com/nkunal1992/agents"
Documentation = "https://github.com/nkunal1992/agents/blob/main/docs/confluence-knowledge.md"
Issues = "https://github.com/nkunal1992/agents/issues"

[project.optional-dependencies]
models = [
    # ONNX stack — no torch: ~40 MB runtime vs 2.4 GB, native ARM64 Windows
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.15,<1",
    "fastembed>=0.9,<1",          # sparse leg (Qdrant/bm25 ONNX)
    "huggingface-hub>=0.26,<1",
]
files = [
    "python-docx>=1.1",
    "pypdf>=4.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
confluence-knowledge = "confluence_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confluence_knowledge = ["models.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
