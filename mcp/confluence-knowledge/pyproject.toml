[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-knowledge"
version = "0.1.7"
description = "Local, GET-only Confluence subtree indexer + grounded-Q&A MCP service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "keyring>=25.2",
    "mcp>=1.6,<2",
    "pip-system-certs>=5.0",  # OS cert store → works behind TLS-inspecting proxies
]

[project.optional-dependencies]
models = [
    "sentence-transformers>=3.0,<4.0",
    "huggingface-hub>=0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
confluence-knowledge = "confluence_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confluence_knowledge = ["models.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
