[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-knowledge"
version = "0.15.0"
description = "Local, GET-only Confluence subtree indexer + grounded-Q&A MCP service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12",
    "numpy>=1.26,<3",
    "packaging>=23",
    "keyring>=25.2",
    "mcp>=1.6,<2",
    "pip-system-certs>=5.0",  # OS cert store → works behind TLS-inspecting proxies
    "psutil>=7,<8",           # memory guard + battery saver for crawls
    # vec0 ANN tables — lifts the 100k-chunk scope cap (#251). Optional at
    # runtime (scan fallback in index.py); no win32/ARM64 wheel exists, and
    # a hard dep makes `pip install` impossible on ARM64 Windows laptops.
    "sqlite-vec>=0.1.9,<0.2; sys_platform!='win32' or platform_machine!='ARM64'",
    # transitive (mcp→PyJWT[crypto], msal): ARM64 wheels stop at 46.0.3 —
    # unpinned, the resolver picks a newer version and tries a Rust build
    # that fails on managed laptops without a toolchain (#302)
    "cryptography<46.0.4; sys_platform=='win32' and platform_machine=='ARM64'",
    "uvicorn>=0.30,<1",       # daemon-hosted Streamable HTTP (#206)
    "starlette>=0.37,<1",     # multi-service mounts + /_services
]

[project.urls]
Repository = "https://github.com/nkunal1992/agents"
Documentation = "https://github.com/nkunal1992/agents/blob/main/docs/confluence-knowledge.md"
Issues = "https://github.com/nkunal1992/agents/issues"

[project.optional-dependencies]
models = [
    # ONNX stack — no torch: ~40 MB runtime vs 2.4 GB, native ARM64 Windows
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.15,<1",
    # sparse leg (Qdrant/bm25 ONNX) — py_rust_stemmers has no win32/ARM64
    # wheel, so the marker skips it there like sqlite-vec; the runtime
    # degrades to dense+rerank (SparseUnavailable, #287/#302)
    "fastembed>=0.9,<1; sys_platform!='win32' or platform_machine!='ARM64'",
    "huggingface-hub>=0.26,<1",
]
files = [
    "python-docx>=1.1",
    "pypdf>=4.0",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.entry-points."knowledge.services"]
confluence-knowledge = "confluence_knowledge.server"

[project.scripts]
confluence-knowledge = "confluence_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confluence_knowledge = ["models.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.isort]
known-first-party = ["confluence_knowledge", "local_knowledge", "sharepoint_knowledge"]
